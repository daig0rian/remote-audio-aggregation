name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  server-pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      # node_modules を tgz に同梱する（package.json の bundleDependencies: true）。
      # インストール先で npm install / registry.npmjs.org への接続が不要になる。
      # 依存はすべて pure JS か、全プラットフォーム分のプリビルド N-API バイナリを
      # 同梱した @evan/opus のみなので、ビルド環境の OS / Node バージョンに依存しない。
      - name: Pack server tarball (with bundled node_modules)
        id: pack
        run: |
          cd server
          VERSION=${GITHUB_REF_NAME#v}
          npm version $VERSION --no-git-tag-version --allow-same-version
          npm ci --omit=dev
          npm pack
          TARBALL=$(ls raa-server-*.tgz)
          tar -tzf "$TARBALL" package/node_modules/@evan/opus/node/x64-linux.node >/dev/null \
            || { echo "ERROR: node_modules not bundled in $TARBALL"; exit 1; }
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Create release and upload server assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            server/${{ steps.pack.outputs.tarball }}
            server/install.sh
          generate_release_notes: true

  module-pack:
    needs: server-pack
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      - name: Pack module zip
        id: pack
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cp -r module raa_monitor
          zip -r raa_monitor-${VERSION}.zip raa_monitor
          echo "zipfile=raa_monitor-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload module to release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.pack.outputs.zipfile }}

  client-build:
    needs: server-pack
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      - name: Build raa-client.exe
        working-directory: client
        shell: cmd
        run: build.bat

      - name: Upload client to release
        uses: softprops/action-gh-release@v3
        with:
          files: client/raa-client.exe
